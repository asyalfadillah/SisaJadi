<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SisaJadi: Aplikasi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9f1e0;--surface:#fffdf7;--ink:#1f3d2b;--muted:#6b7a6e;--brand:#2e7d4f;--on:#fff;--leaf:#b4d38e;--sun:#f3d36b;--soft:#e4e8d2;--line:rgba(31,61,43,.15);--err:#b3402a}
@media (prefers-color-scheme:dark){:root{--bg:#121c16;--surface:#1b2a21;--ink:#eef3e6;--muted:#a3b3a6;--brand:#5fb985;--on:#0f1e16;--soft:#22342a;--line:rgba(238,243,230,.16);--err:#f09a86}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Poppins,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}p{margin:0}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:22px;letter-spacing:-.03em;color:var(--brand)}
.logo svg{width:34px;height:34px}.logo b{color:var(--muted)}
.hello{font-weight:600;font-size:14px}
.view[hidden]{display:none}
h2.t{font-size:26px;margin:6px 0 14px}
.btn{border:0;background:var(--brand);color:var(--on);padding:12px 24px;border-radius:999px;font-weight:600;width:100%}
.btn.o{background:none;border:2px solid var(--brand);color:var(--brand)}
.btn:disabled{opacity:.6}
.search{width:100%;border:1px solid var(--line);background:var(--surface);padding:13px 20px;border-radius:999px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px 6px;margin:14px 0}
.quick button{border:0;background:none;display:grid;gap:6px;justify-items:center;font-size:12px;font-weight:600}
.quick i{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:18px;font-weight:700;background:var(--c);color:#1f3d2b}
.impact{background:linear-gradient(150deg,#2e7d4f,#5da34f);color:#fff;border-radius:28px 28px 28px 6px;padding:22px;margin-bottom:22px}
.impact small{opacity:.92}.impact b{display:block;font-size:44px;line-height:1.1;letter-spacing:-.03em}
.impact .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.impact .row span{background:rgba(255,255,255,.2);padding:4px 14px;border-radius:999px;font-size:13px;font-weight:500}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}
.sec h3{font-size:18px}.sec button{border:0;background:none;color:var(--brand);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:999px;white-space:nowrap;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on);border-color:var(--brand)}
.list{display:grid;gap:12px;margin-top:10px}
.card{display:grid;grid-template-columns:76px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px}
.ph{border-radius:14px;background:var(--c);position:relative;overflow:hidden;min-height:76px}
.ph::after{content:"";position:absolute;right:-18px;bottom:-22px;width:70px;height:70px;border-radius:50% 0 50% 0;background:rgba(255,255,255,.3)}
.card h3{font-size:16px}.card .m{color:var(--muted);font-size:13px}
.card .f{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.pill{background:var(--soft);padding:2px 11px;border-radius:999px;font-size:12px;font-weight:600;margin-left:6px}
.del{border:1px solid var(--err);color:var(--err);background:none;border-radius:999px;padding:3px 13px;font-size:13px;font-weight:600}
.empty{padding:30px 16px;border:2px dashed var(--line);border-radius:20px;text-align:center;color:var(--muted)}
form{display:grid;gap:12px}label{font-size:13px;font-weight:600;display:grid;gap:5px}
input,select{width:100%;border:1px solid var(--line);background:var(--surface);padding:12px 16px;border-radius:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{min-height:20px;font-size:13px;color:var(--err)}.msg.ok{color:var(--brand)}
.who{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:18px}
.who b{font-size:18px}.who p{color:var(--muted);font-size:14px}
.err{background:var(--surface);border:1px solid var(--err);color:var(--err);border-radius:16px;padding:12px 16px;margin:12px 0;font-size:14px}
.err button{margin-top:8px;border:0;background:var(--err);color:var(--bg);padding:6px 16px;border-radius:999px;font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar div{display:flex;width:100%;max-width:456px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:8px;box-shadow:0 12px 30px rgba(31,61,43,.15)}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px;border-radius:22px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{background:var(--soft);color:var(--brand)}
.tabbar .plus{background:var(--brand);color:var(--on);flex:0 0 52px;height:52px;border-radius:50%;margin-top:-22px;font-size:26px;line-height:1;padding:0}
.tabbar .plus[aria-current="page"]{background:var(--brand);color:var(--on);outline:3px solid var(--leaf)}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.load{text-align:center;color:var(--muted);padding:40px 0}
@keyframes up{from{opacity:0;translate:0 20px}}
@keyframes pop{from{opacity:0;scale:.95;translate:0 14px}}
@keyframes sway{50%{rotate:5deg}}
.logo svg{transform-origin:50% 90%;animation:sway 6s ease-in-out infinite}
.view:not([hidden]){animation:up .4s both}
.impact{animation:pop .7s .1s cubic-bezier(.2,.8,.2,1) both}
.card{animation:up .45s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(31,61,43,.12)}
.list .card:nth-child(2){animation-delay:.06s}.list .card:nth-child(3){animation-delay:.12s}.list .card:nth-child(4){animation-delay:.18s}.list .card:nth-child(n+5){animation-delay:.24s}
.quick button{transition:transform .15s}.quick button:active{transform:scale(.92)}
.btn,.chip,.del{transition:transform .15s,background .2s,color .2s}.btn:active,.chip:active,.del:active{transform:scale(.96)}
.tabbar button{transition:background .2s,color .2s,transform .15s}.tabbar button:active{transform:scale(.9)}
.tabbar .plus{transition:transform .2s}.tabbar .plus:hover{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="mark" viewBox="0 0 64 64"><path d="M6 27C9 14 25 8 41 15 31 16 26 22 28 29c2 5 8 5 12 3-8 8-30 7-34-5z" fill="#f3d36b"/><path d="M4 38c-2-10 6-16 15-14-3 11 3 20 12 24C22 56 6 52 4 38z" fill="#a4b83a"/><path d="M32 22c14-6 28 3 25 19-2 11-13 17-24 15 9-5 11-19-1-34z" fill="#1f8a5b"/><path d="M45 6c6 0 10 4 9 9-6 0-10-3-9-9z" fill="#1f5c3a"/></symbol></svg>
<div class="app">
<div class="top"><a class="logo" href="index.html"><svg><use href="#mark"/></svg>Sisa<b>Jadi</b></a><span class="hello" id="hello"></span></div>
<div class="load" id="load">Memuat…</div>
<div class="err" id="err" hidden><span id="errt"></span><br><button id="retry" type="button">Coba lagi</button></div>

<main id="main" hidden>
<section class="view" id="v-home">
<input class="search" id="hs" type="search" placeholder="Cari ampas kopi, kain perca" aria-label="Cari sisa">
<div class="quick">
<button data-go="sell"><i style="--c:#cfe6c0">+</i>Jual Sisa</button>
<button data-go="explore" data-kind="Barter"><i style="--c:#c9e0f3">⇄</i>Barter</button>
<button data-go="explore" data-kind="Donasi"><i style="--c:#fbd9cf">♥</i>Donasi</button>
<button data-go="me"><i style="--c:#f7e6a8">★</i>Sisa Saya</button>
</div>
<div class="impact"><small>Bersama, kita sudah mengalihkan</small><b id="kg">0 kg</b><small>sisa produksi jadi bernilai lagi</small><div class="row"><span id="nl">0 listing</span><span id="nu">0 UMKM</span></div></div>
<div class="sec"><h3>Terbaru</h3><button data-go="explore">Lihat semua</button></div>
<div class="list" id="latest"></div>
</section>

<section class="view" id="v-explore" hidden>
<h2 class="t">Jelajahi sisa</h2>
<input class="search" id="q" type="search" placeholder="Cari sisa" aria-label="Cari sisa">
<div class="chips" id="cc" aria-label="Kategori"></div>
<div class="chips" id="kc" aria-label="Jenis"></div>
<div class="list" id="res"></div>
</section>

<section class="view" id="v-sell" hidden>
<h2 class="t">Jual sisa</h2>
<form id="sf" novalidate>
<label>Nama sisa<input name="title" type="text" maxlength="80" placeholder="Contoh: Ampas kopi arabika"></label>
<div class="two">
<label>Kategori<select name="category"><option>Organik</option><option>Tekstil</option><option>Kemasan</option><option>Kayu</option><option>Botol</option></select></label>
<label>Jenis<select name="kind" id="kind"><option>Jual</option><option>Barter</option><option>Donasi</option></select></label>
</div>
<div class="two">
<label>Berat (kg)<input name="qty" type="number" min="0.1" step="0.1" inputmode="decimal"></label>
<label>Harga (Rp)<input name="price" id="price" type="number" min="0" step="500" inputmode="numeric" value="0"></label>
</div>
<label>Lokasi<input name="city" type="text" maxlength="80" placeholder="Contoh: Jakarta Selatan"></label>
<p class="msg" id="smsg" role="alert"></p>
<button class="btn" id="sb" type="submit">Pasang sisa</button>
</form>
</section>

<section class="view" id="v-me" hidden>
<h2 class="t">Profil</h2>
<div class="who"><b id="mn"></b><p id="me"></p><p id="mp"></p></div>
<div class="sec"><h3>Sisa saya</h3></div>
<div class="list" id="mine"></div>
<p style="height:18px"></p>
<button class="btn o" id="out" type="button">Keluar</button>
</section>
</main>
</div>

<div class="tabbar" id="tabbar" hidden><div>
<button data-go="home" aria-current="page">Beranda</button>
<button data-go="explore">Jelajahi</button>
<button data-go="sell" class="plus" aria-label="Jual sisa">+</button>
<button data-go="me">Profil</button>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
var CFG={url:"https://nowvzdqpkafieabmzccp.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vd3Z6ZHFwa2FmaWVhYm16Y2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzI3NTksImV4cCI6MjExMTEwODc1OX0._n5Vsb4cu5xmRsrggHtr7UMBfdqIj8UqVH5Ps2Ypd2A"};
var $=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var rp=function(n){return n>0?"Rp "+Number(n).toLocaleString("id-ID"):"Gratis"};
var COL={Organik:"#2e7d4f",Tekstil:"#e0a800",Kemasan:"#e8826a",Kayu:"#a9794b",Botol:"#5b9bd5"};
var sb=null,uid=null,L=[],flt={c:"Semua",k:"Semua",q:""},view="home",totalKg=0;

function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.i);toast.i=setTimeout(function(){e.classList.remove("on")},3000)}
function fail(m){$("#load").hidden=true;$("#errt").textContent=m;$("#err").hidden=false}

function card(d,own){
var kg=Number(d.qty_kg);
return'<article class="card"><div class="ph" style="--c:'+(COL[d.category]||"#2e7d4f")+'"></div><div><h3>'+esc(d.title)+'</h3><span class="m">'+esc(kg)+" kg"+(d.city?", "+esc(d.city):"")+'</span><div class="f"><span><b>'+rp(d.price)+'</b><span class="pill">'+esc(d.kind)+'</span></span>'+(own?'<button class="del" data-del="'+esc(d.id)+'">Hapus</button>':"")+"</div></div></article>";
}
function empty(t){return'<div class="empty">'+esc(t)+"</div>"}

function tween(el,to,suf){
var f=function(n){return n.toLocaleString("id-ID",{maximumFractionDigits:1})+suf};
if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=f(to);return}
var t0=null;requestAnimationFrame(function s(t){if(t0===null)t0=t;var p=Math.min((t-t0)/900,1);el.textContent=f(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)});
}
function go(v){
view=v;
["home","explore","sell","me"].forEach(function(x){$("#v-"+x).hidden=x!==v});
$$(".tabbar button").forEach(function(b){if(b.dataset.go===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
try{history.replaceState(null,"","#"+v)}catch(e){}
window.scrollTo(0,0);
if(v==="explore")renderExplore();
if(v==="home")tween($("#kg"),totalKg," kg");
}

function renderHome(){
var kg=L.reduce(function(a,x){return a+Number(x.qty_kg||0)},0),u={};
L.forEach(function(x){u[x.owner]=1});
totalKg=kg;$("#kg").textContent=kg.toLocaleString("id-ID",{maximumFractionDigits:1})+" kg";
$("#nl").textContent=L.length+" listing";$("#nu").textContent=Object.keys(u).length+" UMKM";
$("#latest").innerHTML=L.length?L.slice(0,4).map(function(d){return card(d,false)}).join(""):empty("Belum ada listing. Jadilah yang pertama memasang sisa.");
}
function renderExplore(){
var q=flt.q.toLowerCase();
var r=L.filter(function(d){return(flt.c==="Semua"||d.category===flt.c)&&(flt.k==="Semua"||d.kind===flt.k)&&(!q||(d.title+" "+d.category+" "+(d.city||"")).toLowerCase().indexOf(q)>-1)});
$("#res").innerHTML=r.length?r.map(function(d){return card(d,false)}).join(""):empty("Tidak ada sisa yang cocok. Coba kata kunci atau filter lain.");
}
function renderMine(){
var m=L.filter(function(d){return d.owner===uid});
$("#mine").innerHTML=m.length?m.map(function(d){return card(d,true)}).join(""):empty("Kamu belum memasang sisa.");
}
function renderAll(){renderHome();renderExplore();renderMine()}

function chips(el,list,key){
el.innerHTML=list.map(function(x){return'<button class="chip" type="button" data-v="'+x+'" aria-pressed="'+(flt[key]===x)+'">'+x+"</button>"}).join("");
el.onclick=function(e){var b=e.target.closest(".chip");if(!b)return;flt[key]=b.dataset.v;chips($("#cc"),["Semua","Organik","Tekstil","Kemasan","Kayu","Botol"],"c");chips($("#kc"),["Semua","Jual","Barter","Donasi"],"k");renderExplore()};
}

function load(){
return sb.from("listings").select("id,owner,title,category,kind,qty_kg,price,city,created_at").order("created_at",{ascending:false}).limit(200).then(function(r){
if(r.error)throw r.error;L=r.data||[];renderAll();
});
}

function start(){
if(!window.supabase){fail("Gagal memuat Supabase. Periksa koneksi internet lalu coba lagi.");return}
try{sb=window.supabase.createClient(CFG.url,CFG.key)}catch(e){fail("Konfigurasi Supabase tidak valid.");return}
$("#err").hidden=true;$("#load").hidden=false;
sb.auth.getSession().then(function(r){
var s=r.data&&r.data.session;
if(!s){location.replace("index.html");return}
var u=s.user;uid=u.id;
var name=(u.user_metadata&&u.user_metadata.full_name)||u.email.split("@")[0];
$("#hello").textContent="Halo, "+name;$("#mn").textContent=name;$("#me").textContent=u.email;
sb.from("profiles").select("phone").eq("id",uid).maybeSingle().then(function(p){$("#mp").textContent=(p.data&&p.data.phone)?"Telepon: "+p.data.phone:""});
return load().then(function(){
$("#load").hidden=true;$("#main").hidden=false;$("#tabbar").hidden=false;
var h=(location.hash||"").slice(1);go(["home","explore","sell","me"].indexOf(h)>-1?h:"home");
});
}).catch(function(e){fail("Tidak bisa memuat data: "+((e&&e.message)||"coba lagi."))});
}

document.addEventListener("click",function(e){
var g=e.target.closest("[data-go]");
if(g){if(g.dataset.kind){flt.k=g.dataset.kind;flt.c="Semua"}go(g.dataset.go);if(g.dataset.kind){chips($("#cc"),["Semua","Organik","Tekstil","Kemasan","Kayu","Botol"],"c");chips($("#kc"),["Semua","Jual","Barter","Donasi"],"k")}return}
var d=e.target.closest("[data-del]");
if(d){
if(!window.confirm("Hapus listing ini?"))return;
d.disabled=true;
sb.from("listings").delete().eq("id",d.dataset.del).then(function(r){
if(r.error){d.disabled=false;toast("Gagal menghapus: "+r.error.message);return}
L=L.filter(function(x){return String(x.id)!==d.dataset.del});renderAll();toast("Listing dihapus.");
});
}
});
chips($("#cc"),["Semua","Organik","Tekstil","Kemasan","Kayu","Botol"],"c");
chips($("#kc"),["Semua","Jual","Barter","Donasi"],"k");
$("#q").addEventListener("input",function(){flt.q=this.value;renderExplore()});
$("#hs").addEventListener("keydown",function(e){if(e.key==="Enter"){flt.q=this.value;$("#q").value=this.value;go("explore")}});
$("#kind").addEventListener("change",function(){var p=$("#price");if(this.value==="Jual"){p.disabled=false}else{p.value="0";p.disabled=true}});

$("#sf").addEventListener("submit",function(e){
e.preventDefault();
var f=this,m=$("#smsg"),b=$("#sb");
var title=f.elements.title.value.trim(),qty=parseFloat(f.qty.value),price=f.kind.value==="Jual"?parseInt(f.price.value||"0",10):0;
m.className="msg";
if(title.length<3){m.textContent="Nama sisa minimal 3 huruf.";return}
if(!(qty>0)){m.textContent="Isi berat dalam kg, lebih dari 0.";return}
if(f.kind.value==="Jual"&&!(price>0)){m.textContent="Isi harga lebih dari 0, atau pilih jenis Barter atau Donasi.";return}
b.disabled=true;m.className="msg ok";m.textContent="Menyimpan…";
sb.from("listings").insert({title:title,category:f.category.value,kind:f.kind.value,qty_kg:qty,price:price,city:f.city.value.trim()||null,owner:uid}).select("id,owner,title,category,kind,qty_kg,price,city,created_at").single().then(function(r){
b.disabled=false;
if(r.error){m.className="msg";m.textContent="Gagal menyimpan: "+r.error.message;return}
L.unshift(r.data);renderAll();f.reset();$("#price").disabled=false;$("#price").value="0";m.textContent="";
toast("Sisa berhasil dipasang.");flt={c:"Semua",k:"Semua",q:""};$("#q").value="";go("explore");
chips($("#cc"),["Semua","Organik","Tekstil","Kemasan","Kayu","Botol"],"c");chips($("#kc"),["Semua","Jual","Barter","Donasi"],"k");
});
});
$("#out").addEventListener("click",function(){sb.auth.signOut().then(function(){location.replace("index.html")})});
$("#retry").addEventListener("click",start);
start();
})();
</script>
</body>
</html>
